services:

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8001:8001"

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8002:8002"
    environment:
      USER_SERVICE_URL: http://user-service:8001
    depends_on:
      - user-service